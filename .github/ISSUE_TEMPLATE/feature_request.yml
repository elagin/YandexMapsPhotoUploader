name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Yandex Maps Photo Uploader.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the problem you want to solve or the scenario that is currently inconvenient.
      placeholder: Explain why this feature would be useful.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think the feature should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative approaches or workarounds you have considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, screenshots, mockups, or links that clarify the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request is related to the purpose of the extension.
          required: true
