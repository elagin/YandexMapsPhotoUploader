name: Bug report
description: Report a problem with Yandex Maps Photo Uploader
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please provide enough information to reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe what went wrong.
      placeholder: Describe the problem and what you were doing when it occurred.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Select ...
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "For example: 0.2.1"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "For example: Google Chrome 150.0.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "For example: Windows 11"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console errors or logs
      description: Paste relevant messages from DevTools Console or the extension error page. Remove cookies, tokens, account identifiers, and other sensitive information.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots or any other information that may help investigate the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed sensitive data from logs and screenshots.
          required: true
